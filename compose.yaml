services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: mts-energytool-backend
    env_file:
      - .env
    environment:
      AI_MODE: ${AI_MODE:-MOCK}
      DATABASE_PATH: /data/app.db
    volumes:
      - backend-data:/data
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build: ./frontend
    container_name: mts-energytool-frontend
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  backend-data:
